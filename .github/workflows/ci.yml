name: Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Sur une pull request, un nouveau push annule la vérification en cours : seul
# le dernier commit compte. Sur main, les runs restent en file d'attente.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # Le postinstall lance `nuxt prepare`, qui génère le .nuxt/tsconfig.json
      # dont `tsconfig.check.json` hérite. Le typecheck n'a donc pas besoin d'un
      # build : c'est ce qui permet à ce workflow de tourner en parallèle du
      # déploiement plutôt qu'après lui.
      - name: Install dependencies
        run: pnpm install

      - name: Lint and check formatting
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # Le dépôt fusionne en rebase (ruleset 13369495, allowed_merge_methods:
  # ["rebase"]) : le titre de la pull request n'entre jamais dans l'historique
  # de main, chaque commit y garde son propre message. Le check reste utile
  # ailleurs — c'est la surface de revue, ce qu'affichent `gh pr list` et les
  # notifications — et garde la convention prête pour le jour où la politique
  # de fusion changerait.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Le validateur est vérifié avant de servir : changer un type accepté ou
      # la limite de longueur casse alors un cas connu, plutôt que la CI d'une
      # pull request sans rapport, trois semaines plus tard.
      - name: Vérifier le validateur de titre
        run: .github/scripts/check-pr-title.test.sh

      - name: Vérifier le titre de la pull request
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: .github/scripts/check-pr-title.sh
