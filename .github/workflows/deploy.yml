name: Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Un seul déploiement à la fois par référence. Sur une pull request, un
# nouveau push annule la preview en cours : seul le dernier commit compte.
# Sur main, les runs sont mis en file d'attente et jamais interrompus, pour
# ne pas laisser la production dans un état à moitié publié.
concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Le dépôt accorde par défaut un GITHUB_TOKEN en lecture seule, si bien que
    # l'action déployait sans jamais pouvoir le dire. L'élévation vit ici, dans
    # le seul job qui en a besoin, plutôt que dans le réglage du dépôt qui
    # l'accorderait à tous les workflows.
    #
    # `checks` n'est pas un extra : recevoir un repoToken fait basculer
    # l'action dans un mode où elle ouvre un check run *avant* de déployer.
    # Sans cette ligne elle échoue en 403 sur /check-runs, donc avant même
    # d'avoir contacté Firebase, et le message « Resource not accessible by
    # integration » ne nomme jamais la permission qui manque.
    permissions:
      contents: read
      pull-requests: write
      checks: write

    env:
      # GitHub n'expose pas les secrets du dépôt aux workflows déclenchés par
      # Dependabot : ses pull requests tournent dans un contexte restreint. Le
      # secret arrivait donc vide et l'étape de déploiement échouait *après* un
      # build réussi, rendant chaque PR de Dependabot rouge quel que soit son
      # contenu. On teste sa présence pour ne conditionner que le déploiement.
      HAS_FIREBASE_CREDENTIALS: ${{ secrets.GCP_SA_KEY != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # La version vit dans .nvmrc, seule source de vérité partagée par le
          # CI et les postes de développement. « 20 » laissait setup-node
          # résoudre la dernière 20.x du runner : le build pouvait changer de
          # patch sans qu'aucun commit ne bouge. Elle désigne le Node qui
          # construit le site, pas celui qui exécute les actions ci-dessus.
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build the project
        run: pnpm run generate

      # Le test a besoin de l'artefact construit : il vit donc ici plutôt que
      # dans ci.yml, ce qui évite un second `pnpm generate`. Il teste exactement
      # ce qui sera déployé. Chrome est préinstallé sur les runners ubuntu.
      - name: Smoke test the built site
        run: node scripts/smoke.mjs .output/public

      # Sans identifiants — cas d'une pull request de Dependabot — ce job ne
      # peut pas déployer, alors il passe le relais. L'artefact est le seul
      # lien entre les deux moitiés, et c'est là toute la garantie : le job
      # privilégié qui publiera ces fichiers ne verra jamais le code monté par
      # Dependabot, ni n'exécutera son postinstall. Voir preview-relay.yml.
      - name: Hand the built site to the privileged workflow
        if: env.HAS_FIREBASE_CREDENTIALS != 'true' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: preview-site
          path: .output/public
          retention-days: 1

      # Avec identifiants, le déploiement se fait ici même : le détour par le
      # relais ne sert qu'à ceux qui n'ont pas la clé.
      - name: Deploy to Firebase
        if: env.HAS_FIREBASE_CREDENTIALS == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: cv-portfolio-b023a
          # Fournir le jeton suffit à déclencher le commentaire : l'action
          # poste l'URL de preview sur la pull request et réécrit le même
          # commentaire à chaque push, au lieu d'en empiler un par run. Sur un
          # push sur main elle se tait, faute de pull request dans le contexte.
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # Seul un push sur main va en production. Une pull request part sur
          # un canal de preview jetable, nommé d'après son numéro.
          channelId: ${{ github.event_name == 'push' && 'live' || format('pr-{0}', github.event.number) }}
